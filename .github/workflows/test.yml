name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            toxenv: py312
          - python-version: "3.15"
            toxenv: py315
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          check-latest: true
      - name: Install dependencies
        run: python -m pip install --upgrade pip tox
      - name: Validate build and project configuration
        run: tox
        env:
          TOXENV: validate
      - name: Run linting and formatting
        run: tox
        env:
          TOXENV: lint
      - name: Run tests
        run: tox
        env:
          TOXENV: ${{ matrix.toxenv }}
          GITHUB_TOKEN: ${{ secrets.API_TOKEN }}
